spring.application.name=api-backend
# Conexión a la base de datos - valores leídos desde variables de entorno
spring.datasource.url=${DB_URL}

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Azure SQL (tier serverless) puede tardar ~30-60s en "despertar" tras estar pausada.
# Damos más margen al pool para que la primera petición espere la reconexión
# en vez de fallar con 500, y evitamos que el arranque de la app falle si la
# BD aún no responde.
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=5

# Configuraciones de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
jwt.secret=${JWT_SECRET}
